<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vair</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #cfd8ff;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin: 0;
      }
      p {
        margin: 0;
        opacity: 0.6;
        max-width: 34ch;
      }
      #status {
        font-variant-numeric: tabular-nums;
        opacity: 0.45;
        font-size: 0.85rem;
      }
      #enter-xr {
        margin-top: 0.5rem;
        padding: 0.8rem 1.6rem;
        border: 1px solid #4a5bd0;
        border-radius: 999px;
        background: transparent;
        color: #cfd8ff;
        font: inherit;
        cursor: pointer;
      }
      #enter-xr:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #scenes {
        margin-top: 2rem;
        text-align: left;
        max-width: 34ch;
      }
      #scenes h2 {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.4;
        margin: 0 0 0.6rem;
      }
      #scene-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.4rem;
      }
      .scene {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.7rem 0.9rem;
        border: 1px solid #232c4d;
        border-radius: 0.6rem;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .scene:hover {
        border-color: #4a5bd0;
        background: #0b1024;
      }
      .scene-name {
        font-size: 0.95rem;
      }
      .scene-meta {
        font-size: 0.78rem;
        opacity: 0.45;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>Vair</h1>
      <p>Virtual Artificial Intelligent Reality. Put the headset on and speak a world into existence.</p>
      <button id="enter-xr" disabled>Checking for WebXR…</button>
      <div id="status"></div>

      <div id="scenes" hidden>
        <h2>Saved scenes</h2>
        <ul id="scene-list"></ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
